                                    <div className="animate-in fade-in">
                                        <h3 className="text-2xl font-normal text-gray-900 dark:text-[#e8eaed] mb-6">Customise profile</h3>
                                        <div className="bg-gray-50 dark:bg-[#292a2d] rounded-xl p-8 flex flex-col md:flex-row gap-10 border border-gray-200 dark:border-[#3c4043]">
                                            <div className="flex-1">
                                                <label className="block text-gray-900 dark:text-[#e8eaed] text-sm font-medium mb-3">Name your profile</label>
                                                <input 
                                                    type="text" 
                                                    value={chromeName}
                                                    onChange={(e) => updateActiveProfileData(e.target.value, chromeTheme, chromeAvatar, appThemeMode)}
                                                    className="w-full bg-white dark:bg-[#202124] border border-gray-300 dark:border-[#5f6368] rounded-md px-4 py-3 text-gray-900 dark:text-[#e8eaed] focus:border-blue-500 dark:focus:border-[#8ab4f8] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#8ab4f8] transition-all"
                                                    disabled={activeProfileId === null && !isCreatingProfile}
                                                />
                                                <p className="text-gray-500 dark:text-[#9aa0a6] text-xs mt-2 mb-6">This name appears when you open AnimePulse.</p>

                                                <label className="block text-gray-900 dark:text-[#e8eaed] text-sm font-medium mb-3">Profile Photo URL (Optional)</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="https://..."
                                                    value={chromeAvatar}
                                                    onChange={(e) => updateActiveProfileData(chromeName, chromeTheme, e.target.value, appThemeMode)}
                                                    className="w-full bg-white dark:bg-[#202124] border border-gray-300 dark:border-[#5f6368] rounded-md px-4 py-3 text-gray-900 dark:text-[#e8eaed] focus:border-blue-500 dark:focus:border-[#8ab4f8] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#8ab4f8] transition-all"
                                                    disabled={activeProfileId === null && !isCreatingProfile}
                                                />

                                                <label className="block text-gray-900 dark:text-[#e8eaed] text-sm font-medium mt-8 mb-3">Pick a theme color</label>
                                                <div className="flex flex-wrap gap-4 mb-8">
                                                    {['#8ab4f8', '#f28b82', '#81c995', '#fde293', '#c58af9', '#5f6368'].map(color => (
                                                        <button 
                                                            key={color}
                                                            onClick={() => updateActiveProfileData(chromeName, color, chromeAvatar, appThemeMode)}
                                                            disabled={activeProfileId === null && !isCreatingProfile}
                                                            className={`w-10 h-10 rounded-full cursor-pointer transition-transform hover:scale-110 flex items-center justify-center ${chromeTheme === color ? 'ring-2 ring-offset-2 ring-blue-500 dark:ring-offset-[#292a2d] dark:ring-[#8ab4f8]' : ''}`}
                                                            style={{ backgroundColor: color }}
                                                        >
                                                            {chromeTheme === color && <i className="fa-solid fa-check text-white text-sm"></i>}
                                                        </button>
                                                    ))}
                                                </div>

                                                <label className="block text-gray-900 dark:text-[#e8eaed] text-sm font-medium mb-3">App Appearance</label>
                                                <div className="flex gap-2">
                                                    <button 
                                                        onClick={() => updateActiveProfileData(chromeName, chromeTheme, chromeAvatar, 'light')}
                                                        disabled={activeProfileId === null && !isCreatingProfile}
                                                        className={`flex-1 py-3 rounded-md border flex items-center justify-center gap-2 transition-all ${appThemeMode === 'light' ? 'bg-blue-50 border-blue-500 text-blue-700 dark:bg-[#3c4043] dark:border-[#8ab4f8] dark:text-[#8ab4f8]' : 'bg-white border-gray-300 text-gray-600 dark:bg-black dark:border-[#5f6368] dark:text-[#9aa0a6]'}`}
                                                    >
                                                        <i className="fa-solid fa-sun"></i> Light
                                                    </button>
                                                    <button 
                                                        onClick={() => updateActiveProfileData(chromeName, chromeTheme, chromeAvatar, 'dark')}
                                                        disabled={activeProfileId === null && !isCreatingProfile}
                                                        className={`flex-1 py-3 rounded-md border flex items-center justify-center gap-2 transition-all ${appThemeMode === 'dark' ? 'bg-blue-50 border-blue-500 text-blue-700 dark:bg-[#3c4043] dark:border-[#8ab4f8] dark:text-[#8ab4f8]' : 'bg-white border-gray-300 text-gray-600 dark:bg-black dark:border-[#5f6368] dark:text-[#9aa0a6]'}`}
                                                    >
                                                        <i className="fa-solid fa-moon"></i> Dark
                                                    </button>
                                                    <button 
                                                        onClick={() => updateActiveProfileData(chromeName, chromeTheme, chromeAvatar, 'system')}
                                                        disabled={activeProfileId === null && !isCreatingProfile}
                                                        className={`flex-1 py-3 rounded-md border flex items-center justify-center gap-2 transition-all ${appThemeMode === 'system' ? 'bg-blue-50 border-blue-500 text-blue-700 dark:bg-[#3c4043] dark:border-[#8ab4f8] dark:text-[#8ab4f8]' : 'bg-white border-gray-300 text-gray-600 dark:bg-black dark:border-[#5f6368] dark:text-[#9aa0a6]'}`}
                                                    >
                                                        <i className="fa-solid fa-desktop"></i> System
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="w-full md:w-48 shrink-0 flex flex-col items-center mt-6 md:mt-0">
                                                <div className="text-gray-500 dark:text-[#9aa0a6] text-sm mb-4">Preview</div>
                                                <div className="w-full aspect-[3/4] bg-white dark:bg-[#202124] rounded-lg border border-gray-300 dark:border-[#5f6368] overflow-hidden flex flex-col relative shadow-lg">
                                                    <div className="h-8 flex items-center px-2" style={{ backgroundColor: chromeTheme }}>
                                                        <div className="flex gap-1.5">
                                                            <div className="w-2.5 h-2.5 rounded-full bg-white/50"></div>
                                                            <div className="w-2.5 h-2.5 rounded-full bg-white/50"></div>
                                                            <div className="w-2.5 h-2.5 rounded-full bg-white/50"></div>
                                                        </div>
                                                    </div>
                                                    <div className="flex-1 flex flex-col items-center justify-center bg-gray-50 dark:bg-[#292a2d]">
                                                        {chromeAvatar ? (
                                                            <img src={chromeAvatar} className="w-12 h-12 rounded-full object-cover shadow-sm mb-2" alt="Preview Avatar"/>
                                                        ) : (
                                                            <div className="w-12 h-12 rounded-full flex items-center justify-center text-white text-xl shadow-sm mb-2" style={{ backgroundColor: chromeTheme }}>
                                                                {chromeName ? chromeName.charAt(0).toUpperCase() : '?'}
                                                            </div>
                                                        )}
                                                        <div className="text-[10px] text-gray-800 dark:text-[#e8eaed] truncate w-full px-2 text-center">{chromeName}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeSettingTab === 'sync' && (
                                    <div className="animate-in fade-in">
                                        <h3 className="text-2xl font-normal text-gray-900 dark:text-[#e8eaed] mb-6">Advanced sync settings</h3>
                                        <div className="bg-gray-50 dark:bg-[#292a2d] rounded-xl overflow-hidden mb-8 border border-gray-200 dark:border-[#3c4043]">
                                            <div className="p-4 border-b border-gray-200 dark:border-[#3c4043] flex items-center justify-between">
                                                <div className="text-gray-900 dark:text-[#e8eaed] font-medium">Sync everything</div>
                                                <ToggleSwitch checked={syncEverything} onChange={setSyncEverything} />
                                            </div>
                                            
                                            <div className={`p-4 flex items-center justify-between border-b border-gray-200 dark:border-[#3c4043] transition-opacity ${syncEverything ? 'opacity-50' : 'opacity-100'}`}>
                                                <div className="text-gray-800 dark:text-[#e8eaed]">Watch History</div>
                                                <ToggleSwitch checked={syncEverything || syncHistory} onChange={setSyncHistory} disabled={syncEverything} />
                                            </div>
                                            <div className={`p-4 flex items-center justify-between transition-opacity ${syncEverything ? 'opacity-50' : 'opacity-100'}`}>
                                                <div className="text-gray-800 dark:text-[#e8eaed]">Bookmarks & Lists</div>
                                                <ToggleSwitch checked={syncEverything || syncBookmarks} onChange={setSyncBookmarks} disabled={syncEverything} />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeSettingTab === 'manage_profiles' && (
                                    <div className="animate-in fade-in max-w-4xl flex flex-col items-center justify-center pt-10">
                                        <h3 className="text-3xl font-normal text-gray-900 dark:text-[#e8eaed] mb-2">Who's using AnimePulse?</h3>
                                        
                                        <div className="flex flex-wrap justify-center gap-8 mt-10">
                                            {browserProfiles.map(prof => (
                                                <div 
                                                    key={prof.id} 
                                                    className="flex flex-col items-center gap-3 cursor-pointer group relative"
                                                    onClick={() => {
                                                        setChromeName(prof.name);
                                                        setChromeEmail(prof.email);
                                                        setChromeTheme(prof.color);
                                                        setChromeAvatar(prof.avatar);
                                                        setAppThemeMode(prof.themeMode);
                                                        setActiveProfileId(prof.id);
                                                        handleSettingTabChange('account');
                                                    }}
                                                >
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setChromeName(prof.name);
                                                            setChromeEmail(prof.email);
                                                            setChromeTheme(prof.color);
                                                            setChromeAvatar(prof.avatar);
                                                            setAppThemeMode(prof.themeMode);
                                                            setActiveProfileId(prof.id);
                                                            setIsCreatingProfile(false);
                                                            setActiveSettingTab('customise');
                                                        }}
                                                        className="absolute -top-1 -left-1 w-7 h-7 bg-white dark:bg-[#303134] hover:bg-gray-100 dark:hover:bg-[#3c4043] border border-gray-300 dark:border-[#5f6368] text-gray-500 dark:text-[#9aa0a6] hover:text-blue-500 dark:hover:text-[#8ab4f8] rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all z-10 shadow-lg"
                                                        title="Edit profile"
                                                    >
                                                        <i className="fa-solid fa-pen text-xs"></i>
                                                    </button>
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setBrowserProfiles(prev => prev.filter(p => p.id !== prof.id));
                                                            if (activeProfileId === prof.id) {
                                                                setActiveProfileId(null);
                                                                setChromeName('Guest');
                                                                setChromeEmail('');
                                                                setChromeTheme('#5f6368');
                                                                setChromeAvatar('');
                                                                setAppThemeMode('dark');
                                                            }
                                                        }}
                                                        className="absolute -top-1 -right-1 w-7 h-7 bg-white dark:bg-[#303134] hover:bg-gray-100 dark:hover:bg-[#3c4043] border border-gray-300 dark:border-[#5f6368] text-gray-500 dark:text-[#9aa0a6] hover:text-red-500 dark:hover:text-[#f28b82] rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all z-10 shadow-lg"
                                                        title="Delete profile"
                                                    >
                                                        <i className="fa-solid fa-xmark text-sm"></i>
                                                    </button>
                                                    
                                                    {prof.avatar ? (
                                                        <img src={prof.avatar} className="w-24 h-24 rounded-full object-cover shadow-md transition-transform group-hover:scale-105 border-2" style={{ borderColor: prof.color }} alt={prof.name} />
                                                    ) : (
                                                        <div className="w-24 h-24 rounded-full flex items-center justify-center text-4xl text-white shadow-md transition-transform group-hover:scale-105" style={{ backgroundColor: prof.color }}>
                                                            {prof.name.charAt(0).toUpperCase()}
                                                        </div>
                                                    )}
                                                    
                                                    <span className="text-gray-800 dark:text-[#e8eaed] font-medium group-hover:text-blue-600 dark:group-hover:text-white">{prof.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {['customise', 'sync', 'passwords'].includes(activeSettingTab) && (
                                    <div className="mt-10 pt-6 border-t border-gray-200 dark:border-[#3c4043] flex justify-end gap-3">
                                        {isCreatingProfile && (
                                            <button onClick={() => handleSettingTabChange('manage_profiles')} className="bg-transparent border border-gray-300 dark:border-[#5f6368] text-gray-700 dark:text-[#e8eaed] hover:bg-gray-50 dark:hover:bg-[#303134] font-medium px-6 py-2 rounded-md transition-colors text-sm">
                                                Cancel
                                            </button>
                                        )}
                                        <button onClick={() => {
                                            if (isCreatingProfile) {
                                                const newId = Date.now();
                                                setBrowserProfiles(prev => [...prev, { id: newId, name: chromeName, email: '', color: chromeTheme, avatar: chromeAvatar, themeMode: appThemeMode }]);
                                                setActiveProfileId(newId);
                                                setIsCreatingProfile(false);
                                                showToast("Profile created successfully!");
                                            } else {
                                                showToast("Settings saved successfully!");
                                            }
                                        }} className="bg-blue-600 dark:bg-[#8ab4f8] hover:bg-blue-700 dark:hover:bg-blue-300 text-white dark:text-[#202124] font-medium px-6 py-2 rounded-md transition-colors text-sm">
                                            Save Changes
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen w-screen bg-white dark:bg-black font-sans overflow-hidden transition-colors duration-300">
                    
                    <nav className={`h-full bg-gray-50 dark:bg-[#1e1e24] border-r border-gray-200 dark:border-[#2d2d33] flex flex-col transition-all duration-300 relative group z-50 ${isNavPinned ? 'w-64' : 'w-16'}`}>
                        <button 
                            onClick={() => setIsNavPinned(!isNavPinned)} 
                            className="absolute -right-3 top-6 w-6 h-6 bg-white dark:bg-[#2a2a2e] border border-gray-300 dark:border-[#3f3f46] rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-white z-50 shadow-md hover:bg-gray-100 dark:hover:bg-[#3f3f46] transition-colors"
                            title={isNavPinned ? "Unpin sidebar" : "Pin sidebar"}
                        >
                            <i className={`fa-solid ${isNavPinned ? 'fa-thumbtack text-xs' : 'fa-chevron-right text-xs'}`}></i>
                        </button>

                        <div className="p-4 flex items-center gap-3 border-b border-gray-200 dark:border-[#2d2d33] whitespace-nowrap overflow-hidden">
                            <AnimePulseLogo size={28} showText={isNavPinned} animated={false} />
                        </div>

                        <div className="p-4 border-b border-gray-200 dark:border-[#2d2d33]">
                            <div className="relative">
                                <i className="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                                <input 
                                    type="text" 
                                    placeholder="Search anime..." 
                                    value={searchQuery}
                                    onChange={(e) => {
                                        setSearchQuery(e.target.value);
                                        if (currentView !== 'list' && currentView !== 'bookmarks' && e.target.value.trim() !== '') {
                                            setCurrentView('list');
                                            setActiveTab('All');
                                        }
                                    }}
                                    className={`w-full bg-white dark:bg-[#2a2a2e] border border-gray-300 dark:border-[#3f3f46] text-gray-900 dark:text-white rounded-lg py-2 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500 transition-all ${isNavPinned ? 'opacity-100' : 'opacity-0'} cursor-pointer`}
                                    onFocus={() => { if(!isNavPinned) setIsNavPinned(true); }}
                                />
                            </div>
                        </div>

                        <div className="flex-1 py-4 flex flex-col gap-2 px-2 overflow-x-hidden">
                            <button onClick={() => setCurrentView('home')} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors whitespace-nowrap ${currentView === 'home' ? 'bg-blue-50 dark:bg-blue-600/20 text-blue-600 dark:text-blue-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#2a2a2e] hover:text-gray-900 dark:hover:text-gray-200'}`}>
                                <i className="fa-solid fa-house w-5 text-center"></i>
                                <span className={`${isNavPinned ? 'opacity-100' : 'opacity-0'} transition-opacity duration-300`}>Home</span>
                            </button>
                            <button onClick={() => setCurrentView('list')} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors whitespace-nowrap ${currentView === 'list' ? 'bg-blue-50 dark:bg-blue-600/20 text-blue-600 dark:text-blue-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#2a2a2e] hover:text-gray-900 dark:hover:text-gray-200'}`}>
                                <i className="fa-solid fa-list w-5 text-center"></i>
                                <span className={`${isNavPinned ? 'opacity-100' : 'opacity-0'} transition-opacity duration-300`}>My List</span>
                            </button>
                            <button onClick={() => setCurrentView('bookmarks')} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors whitespace-nowrap ${currentView === 'bookmarks' ? 'bg-blue-50 dark:bg-blue-600/20 text-blue-600 dark:text-blue-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#2a2a2e] hover:text-gray-900 dark:hover:text-gray-200'}`}>
                                <i className="fa-solid fa-star w-5 text-center"></i>
                                <span className={`${isNavPinned ? 'opacity-100' : 'opacity-0'} transition-opacity duration-300`}>Bookmarks</span>
                            </button>
                            <button onClick={() => setCurrentView('profile')} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors whitespace-nowrap ${currentView === 'profile' ? 'bg-blue-50 dark:bg-blue-600/20 text-blue-600 dark:text-blue-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#2a2a2e] hover:text-gray-900 dark:hover:text-gray-200'}`}>
                                <i className="fa-solid fa-user w-5 text-center"></i>
                                <span className={`${isNavPinned ? 'opacity-100' : 'opacity-0'} transition-opacity duration-300`}>Profile</span>
                            </button>
                            <button onClick={() => setCurrentView('settings')} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors whitespace-nowrap ${currentView === 'settings' ? 'bg-blue-50 dark:bg-blue-600/20 text-blue-600 dark:text-blue-400 font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#2a2a2e] hover:text-gray-900 dark:hover:text-gray-200'}`}>
                                <i className="fa-solid fa-gear w-5 text-center"></i>
                                <span className={`${isNavPinned ? 'opacity-100' : 'opacity-0'} transition-opacity duration-300`}>Settings</span>
                            </button>
                        </div>

                        <div className="p-4 border-t border-gray-200 dark:border-[#2d2d33] flex items-center gap-3 whitespace-nowrap overflow-hidden bg-gray-100 dark:bg-[#1a1a1f]">
                            <div className="relative shrink-0">
                                {chromeAvatar ? (
                                    <img src={chromeAvatar} className="w-10 h-10 rounded-full object-cover border-2 border-white dark:border-[#1e1e24] shadow-sm" alt="User" />
                                ) : (
                                    <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold border-2 border-white dark:border-[#1e1e24] shadow-sm" style={{ backgroundColor: chromeTheme }}>
                                        {chromeName ? chromeName.charAt(0).toUpperCase() : '?'}
                                    </div>
                                )}
                                <div className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-[#1a1a1f] rounded-full"></div>
                            </div>
                            <div className={`flex flex-col ${isNavPinned ? 'opacity-100' : 'opacity-0'} transition-opacity duration-300`}>
                                <span className="text-sm font-semibold text-gray-800 dark:text-gray-200 truncate w-32">{chromeName}</span>
                                <span className="text-xs text-green-600 dark:text-green-400">Online</span>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 bg-white dark:bg-black overflow-hidden relative transition-colors duration-300">
                        {currentView === 'home' && renderHome()}
                        {currentView === 'list' && renderList()}
                        {currentView === 'bookmarks' && renderBookmarks()}
                        {currentView === 'profile' && renderProfile()}
                        {currentView === 'settings' && renderSettings()}
                    </main>

                    {toastMessage && (
                        <div className="absolute bottom-6 right-6 bg-white dark:bg-[#303134] border border-gray-200 dark:border-[#5f6368] text-gray-900 dark:text-[#e8eaed] px-6 py-3 rounded-lg shadow-2xl z-50 fade-in flex items-center gap-3">
                            <i className="fa-solid fa-circle-check text-green-500 dark:text-green-400"></i>
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
